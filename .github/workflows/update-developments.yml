name: Update developments

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 minutes past (UTC)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-developments
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read feeds and update developments.json
        run: python scripts/update_developments.py
      - name: Check the file is still valid JSON
        run: python -c "import json; json.load(open('developments.json'))"
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add developments.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Hourly update (automated)"
            git push
          fi
